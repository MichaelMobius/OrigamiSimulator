name: Deploy Origami Lab to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Origami Lab dependencies
        working-directory: apps/lab
        run: npm install
      - name: Verify Origami Lab
        working-directory: apps/lab
        run: npm run check
      - name: Build Origami Lab for project Pages
        working-directory: apps/lab
        run: npm run build -- --base=/OrigamiSimulator/
      - name: Assemble Pages site
        run: |
          mkdir -p site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'CNAME' \
            --exclude 'dist' \
            --exclude 'site' \
            --exclude 'pages-test' \
            --exclude 'apps/lab/node_modules' \
            --exclude 'apps/lab/artifacts' \
            ./ site/
          cp -a dist/lab/. site/
          rm -f site/CNAME
          touch site/.nojekyll
      - name: Install Chromium for production-path smoke
        working-directory: apps/lab
        run: npx playwright install --with-deps chromium
      - name: Smoke test assembled site at project Pages path
        run: |
          rm -rf pages-test
          mkdir -p pages-test/OrigamiSimulator
          cp -a site/. pages-test/OrigamiSimulator/
          python3 -m http.server 4173 --directory pages-test > /tmp/origami-pages-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          for i in {1..50}; do
            if curl --fail --silent http://127.0.0.1:4173/OrigamiSimulator/apps/lab/ >/dev/null; then break; fi
            sleep 0.2
          done
          cd apps/lab
          ORIGAMI_LAB_URL=http://127.0.0.1:4173/OrigamiSimulator/apps/lab/ npm run test:smoke
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
