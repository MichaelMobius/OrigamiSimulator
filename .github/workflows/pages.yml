name: Deploy Origami Lab to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Origami Lab dependencies
        working-directory: apps/lab
        run: npm install
      - name: Verify Origami Lab
        working-directory: apps/lab
        run: npm run check
      - name: Build Origami Lab for project Pages
        working-directory: apps/lab
        run: npm run build -- --base=/OrigamiSimulator/
      - name: Assemble Pages site
        run: |
          mkdir -p site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'dist' \
            --exclude 'site' \
            --exclude 'apps/lab/node_modules' \
            --exclude 'apps/lab/artifacts' \
            ./ site/
          cp -a dist/lab/. site/
          touch site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
