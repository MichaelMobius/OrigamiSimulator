name: Origami Lab app

on:
  push:
    branches:
      - "origami-lab/v0.2-editor-shell"
  pull_request:
    paths:
      - "apps/lab/**"
      - "packages/core/**"
      - "js/origamiLabLegacyBridge.js"
      - ".github/workflows/lab.yml"

jobs:
  lab-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/lab
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Typecheck and build
        run: npm run check
